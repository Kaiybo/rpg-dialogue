<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="0.7" stop-color="#141a2a"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="0.75" stop-color="#9a6a1c"/>
      <stop offset="1" stop-color="#e9c46a"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e9c8"/>
      <stop offset="0.6" stop-color="#e6cf9a"/>
      <stop offset="1" stop-color="#c9a865"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#1b5fa8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- medallion -->
  <circle cx="256" cy="256" r="244" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="232" fill="#3b2a10"/>
  <circle cx="256" cy="256" r="226" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="212" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#d9a441" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- compass studs -->
  <g fill="url(#gold)" stroke="#3b2a10" stroke-width="3">
    <path d="M256 4 l14 22 -14 22 -14 -22z"/>
    <path d="M256 508 l14 -22 -14 -22 -14 22z"/>
    <path d="M4 256 l22 -14 22 14 -22 14z"/>
    <path d="M508 256 l-22 -14 -22 14 22 14z"/>
  </g>

  <!-- back bubble (the NPC) -->
  <g filter="url(#shadow)">
    <path d="M196 118 h170 a48 48 0 0 1 48 48 v62 a48 48 0 0 1 -48 48 h-4 l22 40 -58 -40 h-130 a48 48 0 0 1 -48 -48 v-62 a48 48 0 0 1 48 -48z"
          fill="#1d2740" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
    <g stroke="#d9a441" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <line x1="200" y1="172" x2="360" y2="172"/>
      <line x1="200" y1="204" x2="320" y2="204"/>
    </g>
  </g>

  <!-- front bubble (you) -->
  <g filter="url(#shadow)">
    <path d="M132 232 h190 a50 50 0 0 1 50 50 v52 a50 50 0 0 1 -50 50 h-118 l-62 46 18 -46 h-28 a50 50 0 0 1 -50 -50 v-52 a50 50 0 0 1 50 -50z"
          fill="url(#parch)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
    <!-- three choice gems -->
    <g stroke="#0e2238" stroke-width="3.5" stroke-linejoin="round">
      <path d="M170 308 l24 -30 24 30 -24 30z" fill="url(#gem)"/>
      <path d="M228 308 l24 -30 24 30 -24 30z" fill="url(#gem)"/>
      <path d="M286 308 l24 -30 24 30 -24 30z" fill="url(#gem)"/>
    </g>
    <g fill="#ffffff" opacity="0.75">
      <path d="M194 284 l9 12 -9 5 -9 -5z"/>
      <path d="M252 284 l9 12 -9 5 -9 -5z"/>
      <path d="M310 284 l9 12 -9 5 -9 -5z"/>
    </g>
  </g>
</svg>
