# Builds the zip with the BigWigs packager and uploads it to CurseForge (and Wago).
# - Every push to claude/import: an alpha build (only players who opt into alphas get it).
#   Pushes that only change docs, tools, tests or the CurseForge kit are skipped.
# - A tag like v0.67.0: a release (v0.67.0-beta1 makes a beta), plus a GitHub release.
# No checks run first (the user skips validation).
# Setup: put ## X-Curse-Project-ID: <id> in RPGDialogue/RPGDialogue.toc and add the
# CF_API_TOKEN secret (and WAGO_API_TOKEN / ## X-Wago-ID: for Wago). Without them the
# packager builds the zip and skips the upload. Steps: curseforge/README.md.
name: Package and release

on:
  push:
    branches:
      - claude/import
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "curseforge/**"
      - "tools/**"
      - "tests/**"
      - "banned_phrases.txt"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only the newest changelog section
        run: awk '/^## /{n++} n==1' CHANGELOG.md > "$RUNNER_TEMP/cl.md" && mv "$RUNNER_TEMP/cl.md" CHANGELOG.md
      - uses: BigWigsMods/packager@v2
