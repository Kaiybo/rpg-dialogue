# Tag a version (git tag v0.9.0 && git push --tags) to build the zip and upload it.
# Secrets to add in the GitHub repo settings once the projects exist:
#   CF_API_TOKEN (CurseForge), WAGO_API_TOKEN (Wago Addons).
# Project IDs go in RPGDialogue/RPGDialogue.toc as ## X-Curse-Project-ID: / ## X-Wago-ID:.
name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - name: All checks (release mode)
        run: python3 tools/check_all.py --release --characters 800
      - uses: BigWigsMods/packager@v2
