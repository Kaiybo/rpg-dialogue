# Every push and pull request: tests, lint, validator, voice check, simulation, coverage.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - name: All checks
        run: python3 tools/check_all.py --characters 500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: tools/out/
