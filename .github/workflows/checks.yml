# Tests, lint, validator, voice check, simulation, coverage. Manual only (Actions tab, "Run
# workflow"): runs take hours, and on every push they filled every runner slot and blocked releases.
name: Checks

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - name: All checks
        run: python3 tools/check_all.py --characters 500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: tools/out/
